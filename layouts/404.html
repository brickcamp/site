{{ define "main" }}
<script>
(function () {

  const mapBase = {
    offsets: 'length',
    part: 'part',
    parts: 'part',
    patterns: 'repeat',
    rotations: 'angle',
    shapes: 'shape',
    using: 'part',
  };

  const mapSort = {
    date: 'date-',
    'header.taxonomy.partcount': 'parts-',
    modified: 'date-',
    'part-count': 'parts-',
    random: 'random',
    title: 'title-',
    volume: 'volume-',
  };
  
  // Keys are lower case: they are looked up that way. A fragment ending in '='
  // takes the term's own value. Each names its base too, so a filter still lands
  // right when the path gave no collection to take it from (/techs/with/...).
  const mapTaxonomy = {
    axle_shift_length: 'base=length',
    axle_tilt: 'base=angle',
    axle_tilt_angle: 'base=angle&value=',
    offset_length: 'base=length&value=',
    part: 'base=part&part=',
    pattern_1d: 'base=repeat&type=linear',
    pattern_1d_segsize: 'base=repeat&type=linear',
    pattern_2d: 'base=repeat&type=planar',
    pattern_2d_segsize: 'base=repeat&type=planar',
    pattern_3d: 'base=repeat&type=spacial',
    pattern_3d_segsize: 'base=repeat&type=spacial',
    pattern_segsize: 'base=repeat',
    rotation_angle: 'base=angle&value=',
    // A side count says nothing about the form: a 6 can be a polygon or a star.
    shape_2d: 'base=shape',
    shape_2d_segments: 'base=shape&value=',
    shape_2d_segsize: 'base=shape',
    shape_3d: 'base=shape',
    shape_3d_segments: 'base=shape&value=',
    shape_3d_segsize: 'base=shape',
    shape_segments: 'base=shape&value=',
    shape_segsize: 'base=shape',
    stud_lift: 'base=length&type=studlift',
    stud_lift_length: 'base=length&type=studlift&value=',
    stud_shift: 'base=length&type=studshift',
    stud_shift_length: 'base=length&type=studshift&value=',
    stud_tilt: 'base=angle&type=studtilt',
    stud_tilt_angle: 'base=angle&type=studtilt&value=',
    stud_twist: 'base=angle&type=studturn',
    stud_twist_angle: 'base=angle&type=studturn&value=',
  };

  // Only a plain number can be a value here. The rest were terms Grav made up to
  // group with (_0-45, _9up), its flexible-length marker, or a range (0to90).
  const isValue = /^\d+(?:\.\d+)?$/;

  // Rebrickable mould-variant suffixes, which this site's part ids drop.
  const isVariant = /(?:pat\d+|[a-z])$/;

  // Spreads one mapping over the params. Keyed by dimension, so a collection and
  // the filter under it can both name a base without saying it twice.
  function addMapping(params, mapping, term) {
    for (const piece of mapping.split('&')) {
      let [key, value] = piece.split('=');
      if (value !== '') {
        params.set(key, value);
      } else if (isValue.test(term)) {
        params.set(key, term);
      }
    }
  }

  function legacyList(args) {
    let params = new Map();

    if (args.base) {
      let newBase = mapBase[args.base.toLowerCase()];
      if (newBase) {
        params.set('base', newBase);
      }
    }

    // Grav could narrow a collection by several taxonomies at once, and wrote
    // each as its own path segment: /shape_2D_segments:6/shape_2D_segsize:3
    for (const filter of (args.filters ?? '').split('/')) {
      let cut = filter.indexOf(':');
      if (cut < 0) continue;

      let tax = filter.slice(0, cut).toLowerCase();
      let term = filter.slice(cut + 1);
      if (tax === 'part') term = term.replace(isVariant, '');

      let oldTax = (tax === 'function') ? term.toLowerCase() : tax;
      let newType = mapTaxonomy[oldTax];
      if (!newType) continue;

      // "Nine or more" on a side count was the old filter form's word for circle.
      if (term === '_9up' && oldTax.endsWith('_segments')) {
        params.set('type', 'circle');
      } else {
        addMapping(params, newType, term);
      }
    }

    if (args.by) {
      let oldDir = (args.dir && args.dir === 'desc') ? 'desc' : 'asc';
      let newSort = mapSort[args.by.toLowerCase()] ?? 'date-desc';
      if (newSort) {
        if (newSort.endsWith('-')) newSort += oldDir;
        params.set('sort', newSort);
      }
    }

    return [...params].map(([key, value]) => `${key}=${value}`).join('&');
  }

  function homepage(args) {
    const params = legacyList(args);
    return params ? `/?${params}` : `/`;
  }

  const rules = [
    {
      // search → homepage
      match: /^\/search/,
      apply: (m) => `/`
    },
    {
      // techs → homepage
      match: /^\/techs$/,
      apply: (m) => `/`
    },
    {
      // legacy privacy paths → privacy policy (must precede the legal rule)
      match: /^\/(?:legal\/)?(?:privacy|datenschutz)/,
      apply: (m) => `/privacy/`
    },
    {
      // remaining legal and contact paths → legal notice, which carries the address
      match: /^\/(?:legal|imprint|impressum|contact|kontakt)/,
      apply: (m) => `/legal/`
    },
    {
      // order-by-pages → sorted homepage
      match: /^\/techs\/order-by\/(?<by>part-count|volume|date)\/(?<dir>asc|desc)/,
      apply: (m) => homepage(m.groups)
    },
    {
      // old result lists (collection/tax:term.../sorting) → filtered homepage.
      // `filters` is lazy so the ordering, which looks like a filter, stays out.
      match: /^\/techs(?:\/(?<base>[\w-]+))?(?<filters>(?:\/\w+:[^/]+)*?)(?:\/orderby:(?<by>[\w.-]+)\/orderdir:(?<dir>asc|desc))?$/,
      apply: (m) => homepage(m.groups)
    },
    {
      // old partlists → partlist on homepage
      match: /^\/parts.*/,
      apply: (m) => `/?base=part`
    },
    {
      // old part page → part search on homepage
      match: /^\/part\/(\d+)(\D.*)?/,
      apply: (m) => `/?base=part&part=${m[1]}`
    }
  ];

  function normalize(path) {
    return path.replace(/\/+$/, '') || '/';
  }

  function removeLanguage(path) {
    return path.replace(/^\/(de|en)(\/|$)/, '/');
  }

  function applyRules(path) {
    for (const rule of rules) {
      const match = path.match(rule.match);
      if (match) return rule.apply(match);
    }
    return path;
  }

  const path = normalize(window.location.pathname);
  const target = applyRules(removeLanguage(path));
  if (target !== path) {
    window.location.replace(target);
  }
})();
</script>

<div class="container text-center">
  <img src="/404.png" alt="404" class="d-block mx-auto py-3">
  <h1>Ooops!</h1>
  <p>The page you are looking for was not found.</p>
</div>
{{ end }}
