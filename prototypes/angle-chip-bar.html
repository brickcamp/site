<!--
  PROTOTYPE — throwaway, not wired into the Hugo build. Do not import from
  layouts/ or assets/. Open directly in a browser (file:// is fine).

  Question: what should the faceted chip-bar replacement for the tabs +
  dropdown nav look like, specifically for the Angle scope (composite
  connector x motion type, discrete-degree value picker)?

  Three variants of the Angle facet UI, switchable via ?variant=A|E|F (also
  via the floating pill / arrow keys), inside one shared chip-bar shell
  (scope row, fake result grid). Length / Repeat / Shape / Parts are unstyled
  placeholder chips in every variant — not the question being tested here.

  A: connector/motion toggles + degree wedge-strip, in a popover under a
     labeled chip (text + icon).
  E: the same composed connector/motion/degree facets, but as bare icon
     buttons sitting directly in the bar — no popover, no text, tooltip only.
  F: E's bare-icon bar, but a label appears once an option is selected (and
     only then) instead of tooltip-only. Applies to the scope row too — "All
     / Angles / Lengths / …" collapse to icon+tooltip except the active
     scope. Connector/motion buttons gain a text span when active. Degree
     values are the one exception: the number is always shown below the
     wedge icon, selected or not, same as variant A's wedge-strip.

  History (earlier variants dropped after user feedback, kept here for
  context since the file itself is the handoff — no conversation to refer
  back to):
    - A 2x2 unified type grid (one glyph per connector+motion combo) and a
      circular dial for degrees were tried and dropped in favor of composed
      (decomposed) toggles — user preferred picking connector and motion
      independently over recognizing one fused glyph per combination.
    - An always-visible "inline rail" (no popover, but still text-labeled)
      was tried as a middle step between A and E; dropped once E proved a
      popover isn't needed at all when the controls are icon-only.
    - The wedge icon (degree value glyph) is a half-circle protractor: flat
      baseline = 0 deg (closed), wedge fill sweeps counterclockwise to the
      target degree, fully shaded only at 180 deg — 180 is the real ceiling
      across all angle types, so the glyph is a half-circle, not a full one.
    - A real bug worth knowing about if touching icon code: connectorGlyph()
      and motionGlyph() must return a *complete* <svg>, not a bare fragment —
      an earlier version returned unwrapped <path>/<circle> markup and every
      toggle button silently showed no icon at all (invisible, not just
      undersized) because bare SVG child elements are not valid outside an
      <svg> container. Also watch for CSS descendant selectors like
      `.chip svg` — since popovers get appended *inside* the .chip element,
      such a rule would resize every icon nested in the popover too, not
      just the chip's own label icon. Prefer `.chip > svg` for that reason.

  Open questions for the next round: is A vs E actually settled (E is the
  latest-built and most-liked so far), or worth living with both a bit
  longer; do Size/Newest deserve the same treatment eventually; does this
  approach hold up once Length/Repeat/Shape/Parts get real (non-placeholder)
  facets instead of "coming soon" chips.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>brick.camp — chip bar prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #202325;
    --bg-elev: #2b2f31;
    --bg-elev-2: #34393c;
    --text: #e8e6e3;
    --text-dim: #9aa0a3;
    --accent: #3fae4a;
    --accent-soft: rgba(63,174,74,0.16);
    --border: #3a3f42;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-bottom: 80px;
  }
  header.topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: #16181a;
    border-bottom: 1px solid var(--border);
  }
  header.topbar .brand { font-weight: 700; color: var(--accent); }
  header.topbar .spacer { flex: 1; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-elev); color: var(--text); }
  .search-slot { display: flex; align-items: center; }
  .search-slot input {
    width: 0; opacity: 0; padding: 0; border: none; margin-left: 0;
    background: var(--bg-elev); color: var(--text); border-radius: 6px;
    transition: width .18s ease, opacity .18s ease, padding .18s ease, margin .18s ease;
  }
  .search-slot.open input {
    width: 200px; opacity: 1; padding: 6px 10px; margin-left: 8px;
    border: 1px solid var(--border);
  }

  main { max-width: 980px; margin: 0 auto; padding: 18px 16px; }

  #scope-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .scope-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 10px;
    background: var(--bg-elev); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
  }
  .scope-btn svg { width: 18px; height: 18px; }
  .scope-btn.active {
    background: var(--accent-soft); border-color: var(--accent); color: var(--text);
  }

  #chip-bar {
    position: relative;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start;
    padding: 10px; border-radius: 10px;
    background: var(--bg-elev); border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .chip {
    position: relative;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--bg-elev-2); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; user-select: none;
  }
  /* direct-child only: a popover gets appended *inside* the chip, and it
     holds icons of its own (wedge strip, toggle icons) that must NOT be
     caught by this rule too. */
  .chip > svg { width: 16px; height: 16px; }
  .chip.disabled {
    color: var(--text-dim); cursor: default; opacity: .55;
  }
  .chip.filled { border-color: var(--accent); background: var(--accent-soft); }
  .chip.pushable { margin-left: auto; }
  .chip-clear {
    background: transparent; border: none; color: inherit; cursor: pointer;
    width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin-left: 2px; opacity: .75;
  }
  .chip-clear:hover { background: rgba(255,255,255,.15); opacity: 1; }

  .icon-cluster { display: flex; gap: 4px; align-items: center; }
  .icon-btn-plain {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; background: var(--bg-elev-2); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
  }
  .icon-btn-plain svg { max-width: 22px; max-height: 22px; }
  .icon-btn-plain.active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .icon-btn-plain.labeled { width: auto; padding: 0 10px; gap: 6px; }
  .icon-btn-plain.labeled span { font-size: 12px; white-space: nowrap; }
  .bar-divider { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }

  .popover {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    background: var(--bg-elev-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    min-width: 220px;
  }
  .popover h4 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600;
  }
  .toggle-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .toggle-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 12px; border-radius: 8px; background: var(--bg-elev);
    border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; flex: 1;
  }
  .toggle-btn svg { width: 22px; height: 22px; }
  .toggle-btn span { font-size: 11px; }
  .toggle-btn.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

  .wedge-strip { display: flex; gap: 8px; flex-wrap: wrap; max-width: 260px; }
  .wedge-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-elev); cursor: pointer; color: var(--text-dim);
  }
  .wedge-item svg { max-width: 40px; max-height: 26px; }
  .wedge-item.active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .wedge-item span { font-size: 10px; }

  #result-count { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
  .card {
    border-radius: 10px; overflow: hidden; background: var(--bg-elev);
    border: 1px solid var(--border);
  }
  .card .thumb {
    height: 90px;
    background: linear-gradient(135deg, var(--bg-elev-2), #444a4d);
    display: flex; align-items: center; justify-content: center; color: var(--text-dim);
  }
  .card .thumb svg { width: 34px; height: 34px; }
  .card .title { padding: 8px 10px; font-size: 12.5px; }

  /* floating variant switcher, per prototype skill spec */
  #switcher {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: #0d0f10; border: 1px solid #444; border-radius: 999px;
    padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 100;
    font-size: 12.5px;
  }
  #switcher button {
    background: #23272a; border: 1px solid #444; color: var(--text);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  #switcher button:hover { background: #313538; }
  #switcher .label { min-width: 220px; text-align: center; color: var(--text-dim); }
  #switcher .label b { color: var(--text); }
</style>
</head>
<body>

<header class="topbar">
  <span class="brand">brick.camp</span>
  <div class="spacer"></div>
  <div class="search-slot" id="search-slot">
    <button class="icon-btn" id="search-toggle" title="Search (demoted, secondary)">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6"/><path d="M14 14 L18 18" stroke-linecap="round"/></svg>
    </button>
    <input placeholder="search entries…" />
  </div>
</header>

<main>
  <div id="scope-row"></div>
  <div id="chip-bar"></div>
  <div id="result-count"></div>
  <div id="results"></div>
</main>

<div id="switcher">
  <button id="prev">‹</button>
  <div class="label" id="switcher-label"></div>
  <button id="next">›</button>
</div>

<script>
/* ---------- fake data ---------- */
const ANGLE_TYPES = {
  studtilt:  { connector: 'stud', motion: 'tilt', values: [15,20,25,30,45,60,75,90] },
  studturn:  { connector: 'stud', motion: 'turn', values: [15,30,45,60,90] },
  axletilt:  { connector: 'axle', motion: 'tilt', values: [15,22.5,30,45,60,90] },
  axleturn:  { connector: 'axle', motion: 'turn', values: [15,30,45,60,90,180] },
};

const ENTRIES = [
  { title: 'Swivel Hinges Hexadecagon', connector: 'stud', motion: 'turn', value: 22.5 },
  { title: 'Slope Headlight Tiling',    connector: 'stud', motion: 'tilt', value: 45 },
  { title: 'Clipped Cheese Triangle',   connector: 'stud', motion: 'tilt', value: 30 },
  { title: 'Bar Hinge Fan Spread',      connector: 'axle', motion: 'turn', value: 15 },
  { title: 'Technic Pin Elbow',         connector: 'axle', motion: 'tilt', value: 90 },
  { title: 'Roof Ridge Offset',         connector: 'stud', motion: 'tilt', value: 60 },
  { title: 'Turntable Segment Ring',    connector: 'stud', motion: 'turn', value: 30 },
  { title: 'Axle Knee Brace',           connector: 'axle', motion: 'tilt', value: 45 },
  { title: 'Click Hinge Fold',          connector: 'stud', motion: 'tilt', value: 90 },
  { title: 'Half-Turn Baseplate Spin',  connector: 'axle', motion: 'turn', value: 180 },
  { title: 'Shallow Wedge Roofline',    connector: 'stud', motion: 'tilt', value: 15 },
  { title: 'Dual Axle Scissor',         connector: 'axle', motion: 'turn', value: 90 },
];

/* ---------- state ---------- */
const state = {
  scope: 'angle',
  connector: null, // 'stud' | 'axle' | null
  motion: null,    // 'tilt' | 'turn' | null
  value: null,     // number | null
  openPopover: null, // 'type' | 'value' | null — only variant A uses this
  variant: (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase(),
};

const VARIANTS = {
  A: 'Composed toggles + wedge strip (popover)',
  E: 'Icons only, composed toggles (no popover)',
  F: 'Icons only, label on selection (values always numbered)',
};

/* ---------- icon builders ---------- */
function svg(inner, size=18, vb=18) {
  return `<svg viewBox="0 0 ${vb} ${vb}" width="${size}" height="${size}" fill="none">${inner}</svg>`;
}
function connectorGlyph(kind, size=18) {
  if (kind === 'stud') return svg(`<circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="9" r="2.6" fill="currentColor"/>`, size);
  return svg(`<path d="M9 2 V16 M2 9 H16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>`, size);
}
function motionGlyph(kind, size=18) {
  if (kind === 'tilt') return svg(`
    <path d="M2 15 H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M2 15 A13 13 0 0 1 11.5 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M11.5 4.3 l-3.4 0.6 M11.5 4.3 l1.2 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`, size);
  return svg(`
    <path d="M14.4 9a5.4 5.4 0 1 1-1.6-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M14.4 3.2v4h-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`, size);
}
function scopeIcon(name) {
  const map = {
    all:    `<rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/>`,
    angle:  `<path d="M3 15 H15 M3 15 A12 12 0 0 1 12 4" stroke="currentColor" stroke-width="1.6" fill="none"/>`,
    length: `<circle cx="3" cy="9" r="1.6" fill="currentColor"/><circle cx="7" cy="9" r="1.6" fill="currentColor"/><circle cx="11" cy="9" r="1.6" fill="currentColor"/><circle cx="15" cy="9" r="1.6" fill="currentColor"/>`,
    repeat: `<circle cx="9" cy="4" r="1.4" fill="currentColor"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="14" r="1.4" fill="currentColor"/><circle cx="14" cy="9" r="1.4" fill="currentColor"/><circle cx="4" cy="9" r="1.4" fill="currentColor"/>`,
    shape:  `<path d="M9 2 L16 6.5 V13.5 L9 18 L2 13.5 V6.5 Z" stroke="currentColor" stroke-width="1.4" fill="none"/>`,
    parts:  `<rect x="2" y="6" width="14" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="6" cy="6" r="1.4" fill="currentColor"/><circle cx="12" cy="6" r="1.4" fill="currentColor"/>`,
  };
  return svg(map[name] || '', 18);
}
function comboIcon(connector, motion, size=28) {
  const c = connector === 'stud'
    ? `<circle cx="${motion==='tilt'?4:14}" cy="${motion==='tilt'?21:14}" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="${motion==='tilt'?4:14}" cy="${motion==='tilt'?21:14}" r="1.1" fill="currentColor"/>`
    : `<path d="M${motion==='tilt'?4:14} ${motion==='tilt'?18:11} v6 M${motion==='tilt'?1:11} ${motion==='tilt'?21:14} h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
  if (motion === 'tilt') {
    return svg(`
      <path d="M4 21 H24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M4 21 A18 18 0 0 1 17 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M17 6.5 l-4.6 0.8 M17 6.5 l1.4 4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      ${c}`, size, 28);
  }
  return svg(`
    <path d="M22 14a8 8 0 1 1-2.4-5.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M22 5v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    ${c}`, size, 28);
}
function wedgeIcon(deg, width=40) {
  // half-circle protractor: 0deg = flat right (closed), 180deg = flat left (fully open) — 180 is the real max, so no more of the circle is ever used.
  const w = 48, h = 28, cx = 24, cy = 24, r = 20;
  const rad = deg * Math.PI/180;
  const tip = { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
  const zero = { x: cx + r, y: cy };
  const large = deg > 180 ? 1 : 0;
  const height = Math.round(width * h/w);
  return `<svg viewBox="0 0 ${w} ${h}" width="${width}" height="${height}">
    <path d="M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy}" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".45"/>
    <line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="currentColor" stroke-width="1.4" opacity=".45"/>
    <path d="M${cx},${cy} L${zero.x},${zero.y} A${r},${r} 0 ${large} 0 ${tip.x},${tip.y} Z" fill="var(--accent)" opacity=".35"/>
    <line x1="${cx}" y1="${cy}" x2="${tip.x}" y2="${tip.y}" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="2.4" fill="currentColor"/>
  </svg>`;
}

/* ---------- derived state ---------- */
function currentTypeKey() {
  if (!state.connector || !state.motion) return null;
  return Object.keys(ANGLE_TYPES).find(k =>
    ANGLE_TYPES[k].connector === state.connector && ANGLE_TYPES[k].motion === state.motion);
}
function valuesForCurrentType() {
  const key = currentTypeKey();
  if (key) return ANGLE_TYPES[key].values;
  const all = new Set();
  Object.values(ANGLE_TYPES).forEach(t => t.values.forEach(v => all.add(v)));
  return [...all].sort((a,b) => a-b);
}
function typeLabel() {
  if (state.connector && state.motion) return `${cap(state.connector)} · ${cap(state.motion)}`;
  if (state.connector) return `${cap(state.connector)} · any`;
  if (state.motion) return `any · ${cap(state.motion)}`;
  return 'Any Type';
}
function cap(s) { return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------- rendering: shell ---------- */
const SCOPES = [
  { key: 'all', title: 'All' },
  { key: 'angle', title: 'Angles' },
  { key: 'length', title: 'Lengths' },
  { key: 'repeat', title: 'Repeat' },
  { key: 'shape', title: 'Shapes' },
  { key: 'parts', title: 'Parts' },
];

function renderScopeRow() {
  const el = document.getElementById('scope-row');
  const iconOnly = state.variant === 'F';
  el.innerHTML = SCOPES.map(s => {
    const active = state.scope === s.key;
    const showLabel = !iconOnly || active;
    return `
    <button class="scope-btn ${active?'active':''}" data-scope="${s.key}" title="${s.title}">
      ${scopeIcon(s.key)} ${showLabel ? `<span>${s.title}</span>` : ''}
    </button>`;
  }).join('');
  el.querySelectorAll('[data-scope]').forEach(btn => {
    btn.onclick = () => { state.scope = btn.dataset.scope; state.openPopover = null; renderAll(); };
  });
}

function placeholderChips() {
  return `
    <div class="chip disabled">↕ Type — soon</div>
    <div class="chip disabled">＃ Value — soon</div>
    <div class="chip disabled pushable">▭ Size — any</div>
    <div class="chip disabled">↓ Newest</div>
  `;
}

function sizeSortChips(pushable=true) {
  return `
    <div class="chip disabled ${pushable?'pushable':''}">▭ Size — any</div>
    <div class="chip disabled">↓ Newest</div>
  `;
}
function wireChipClear(scopeEl) {
  scopeEl.querySelectorAll('[data-clear]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (btn.dataset.clear === 'type') { state.connector = null; state.motion = null; }
      if (btn.dataset.clear === 'value') { state.value = null; }
      state.openPopover = null;
      renderAll();
    };
  });
}

/* ---------- variant A: composed toggles + wedge strip, in a popover ---------- */
function renderChipBarA() {
  const el = document.getElementById('chip-bar');
  if (state.scope !== 'angle') { el.innerHTML = placeholderChips(); return; }
  const typeFilled = state.connector || state.motion;
  el.innerHTML = `
    <div class="chip ${typeFilled?'filled':''}" id="chip-type">${scopeIcon('angle')} ${typeLabel()}${typeFilled ? '<button class="chip-clear" data-clear="type" title="Clear type">✕</button>' : ''}</div>
    <div class="chip ${state.value?'filled':''}" id="chip-value">＃ ${state.value ? state.value+'°' : 'Any Value'}${state.value ? '<button class="chip-clear" data-clear="value" title="Clear value">✕</button>' : ''}</div>
    ${sizeSortChips()}
  `;
  document.getElementById('chip-type').onclick = (e) => { e.stopPropagation(); togglePopover('type'); };
  document.getElementById('chip-value').onclick = (e) => { e.stopPropagation(); togglePopover('value'); };
  wireChipClear(el);

  if (state.openPopover === 'type') {
    const pop = document.createElement('div');
    pop.className = 'popover';
    pop.innerHTML = `
      <h4>Connector</h4>
      <div class="toggle-row">
        <button class="toggle-btn ${state.connector==='stud'?'active':''}" data-connector="stud" title="Stud">${connectorGlyph('stud')}<span>Stud</span></button>
        <button class="toggle-btn ${state.connector==='axle'?'active':''}" data-connector="axle" title="Axle">${connectorGlyph('axle')}<span>Axle</span></button>
      </div>
      <h4>Motion</h4>
      <div class="toggle-row">
        <button class="toggle-btn ${state.motion==='tilt'?'active':''}" data-motion="tilt" title="Tilt (hinge)">${motionGlyph('tilt')}<span>Tilt</span></button>
        <button class="toggle-btn ${state.motion==='turn'?'active':''}" data-motion="turn" title="Turn (rotate)">${motionGlyph('turn')}<span>Turn</span></button>
      </div>
    `;
    document.getElementById('chip-type').appendChild(pop);
    pop.querySelectorAll('[data-connector]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      state.connector = state.connector === b.dataset.connector ? null : b.dataset.connector;
      renderAll();
    });
    pop.querySelectorAll('[data-motion]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      state.motion = state.motion === b.dataset.motion ? null : b.dataset.motion;
      renderAll();
    });
  }
  if (state.openPopover === 'value') {
    const pop = document.createElement('div');
    pop.className = 'popover';
    const values = valuesForCurrentType();
    pop.innerHTML = `
      <h4>Degrees${currentTypeKey() ? '' : ' (pick a type to narrow)'}</h4>
      <div class="wedge-strip">
        ${values.map(v => `
          <div class="wedge-item ${state.value===v?'active':''}" data-value="${v}" title="${v}°">
            ${wedgeIcon(v)}<span>${v}°</span>
          </div>`).join('')}
      </div>
    `;
    document.getElementById('chip-value').appendChild(pop);
    pop.querySelectorAll('[data-value]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const v = Number(b.dataset.value);
      state.value = state.value === v ? null : v;
      renderAll();
    });
  }
}

function togglePopover(which) {
  state.openPopover = state.openPopover === which ? null : which;
  renderAll();
}
document.addEventListener('click', () => {
  if (state.openPopover) { state.openPopover = null; renderAll(); }
});

/* ---------- variant E: icons only, composed toggles, no popover ---------- */
function renderChipBarE() {
  const el = document.getElementById('chip-bar');
  if (state.scope !== 'angle') { el.innerHTML = placeholderChips(); return; }
  const values = valuesForCurrentType();
  el.innerHTML = `
    <div class="icon-cluster" id="connector-icons">
      <button class="icon-btn-plain ${state.connector==='stud'?'active':''}" data-connector="stud" title="Stud">${connectorGlyph('stud')}</button>
      <button class="icon-btn-plain ${state.connector==='axle'?'active':''}" data-connector="axle" title="Axle">${connectorGlyph('axle')}</button>
    </div>
    <div class="icon-cluster" id="motion-icons">
      <button class="icon-btn-plain ${state.motion==='tilt'?'active':''}" data-motion="tilt" title="Tilt (hinge)">${motionGlyph('tilt')}</button>
      <button class="icon-btn-plain ${state.motion==='turn'?'active':''}" data-motion="turn" title="Turn (rotate)">${motionGlyph('turn')}</button>
    </div>
    <div class="bar-divider"></div>
    <div class="icon-cluster" id="value-icons-e">
      ${values.map(v => `
        <button class="icon-btn-plain ${state.value===v?'active':''}" data-value="${v}" title="${v}°">
          ${wedgeIcon(v, 30)}
        </button>`).join('')}
    </div>
    ${sizeSortChips()}
  `;
  el.querySelectorAll('#connector-icons button').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    state.connector = state.connector === b.dataset.connector ? null : b.dataset.connector;
    renderAll();
  });
  el.querySelectorAll('#motion-icons button').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    state.motion = state.motion === b.dataset.motion ? null : b.dataset.motion;
    renderAll();
  });
  el.querySelectorAll('#value-icons-e button').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const v = Number(b.dataset.value);
    state.value = state.value === v ? null : v;
    renderAll();
  });
}

/* ---------- variant F: icons only, label appears once selected ---------- */
function renderChipBarF() {
  const el = document.getElementById('chip-bar');
  if (state.scope !== 'angle') { el.innerHTML = placeholderChips(); return; }
  const values = valuesForCurrentType();
  const connectorBtn = (kind, label) => {
    const active = state.connector === kind;
    return `<button class="icon-btn-plain ${active?'active labeled':''}" data-connector="${kind}" title="${label}">
      ${connectorGlyph(kind)}${active ? `<span>${label}</span>` : ''}
    </button>`;
  };
  const motionBtn = (kind, label, title) => {
    const active = state.motion === kind;
    return `<button class="icon-btn-plain ${active?'active labeled':''}" data-motion="${kind}" title="${title}">
      ${motionGlyph(kind)}${active ? `<span>${label}</span>` : ''}
    </button>`;
  };
  el.innerHTML = `
    <div class="icon-cluster" id="connector-icons">
      ${connectorBtn('stud', 'Stud')}
      ${connectorBtn('axle', 'Axle')}
    </div>
    <div class="icon-cluster" id="motion-icons">
      ${motionBtn('tilt', 'Tilt', 'Tilt (hinge)')}
      ${motionBtn('turn', 'Turn', 'Turn (rotate)')}
    </div>
    <div class="bar-divider"></div>
    <div class="icon-cluster" id="value-icons-f">
      ${values.map(v => `
        <div class="wedge-item ${state.value===v?'active':''}" data-value="${v}" title="${v}°">
          ${wedgeIcon(v, 30)}<span>${v}°</span>
        </div>`).join('')}
    </div>
    ${sizeSortChips()}
  `;
  el.querySelectorAll('#connector-icons button').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    state.connector = state.connector === b.dataset.connector ? null : b.dataset.connector;
    renderAll();
  });
  el.querySelectorAll('#motion-icons button').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    state.motion = state.motion === b.dataset.motion ? null : b.dataset.motion;
    renderAll();
  });
  el.querySelectorAll('#value-icons-f [data-value]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const v = Number(b.dataset.value);
    state.value = state.value === v ? null : v;
    renderAll();
  });
}

/* ---------- fake results ---------- */
function renderResults() {
  const filtered = ENTRIES.filter(e =>
    (!state.connector || e.connector === state.connector) &&
    (!state.motion || e.motion === state.motion) &&
    (state.value == null || e.value === state.value));
  document.getElementById('result-count').textContent = state.scope === 'angle'
    ? `${filtered.length} of ${ENTRIES.length} entries`
    : `${ENTRIES.length} entries (filters apply to Angle scope only in this prototype)`;
  const list = state.scope === 'angle' ? filtered : ENTRIES;
  document.getElementById('results').innerHTML = list.map(e => `
    <div class="card">
      <div class="thumb">${comboIcon(e.connector, e.motion, 30)}</div>
      <div class="title">${e.title}</div>
    </div>
  `).join('');
}

/* ---------- search toggle (demoted, secondary) ---------- */
document.getElementById('search-toggle').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('search-slot').classList.toggle('open');
};

/* ---------- render dispatch ---------- */
function renderAll() {
  renderScopeRow();
  if (state.variant === 'A') renderChipBarA();
  else if (state.variant === 'F') renderChipBarF();
  else renderChipBarE();
  renderResults();
  renderSwitcher();
}

/* ---------- floating variant switcher ---------- */
const ORDER = ['A','E','F'];
function setVariant(v) {
  state.variant = v;
  state.openPopover = null;
  const url = new URL(location.href);
  url.searchParams.set('variant', v);
  history.replaceState(null, '', url);
  renderAll();
}
function renderSwitcher() {
  document.getElementById('switcher-label').innerHTML =
    `<b>${state.variant}</b> — ${VARIANTS[state.variant]}`;
}
document.getElementById('prev').onclick = () => {
  const i = ORDER.indexOf(state.variant);
  setVariant(ORDER[(i - 1 + ORDER.length) % ORDER.length]);
};
document.getElementById('next').onclick = () => {
  const i = ORDER.indexOf(state.variant);
  setVariant(ORDER[(i + 1) % ORDER.length]);
};
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});

if (!ORDER.includes(state.variant)) state.variant = 'A';
renderAll();
</script>
</body>
</html>
