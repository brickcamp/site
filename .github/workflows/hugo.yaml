name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DART_SASS_VERSION: 1.93.2
      HUGO_VERSION: 0.164.0
      NODE_VERSION: 24.15.0
      TZ: Europe/Oslo
    steps:
      # enableGitInfo needs the full history; nothing else does.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Configure Git
        run: |
          git config core.quotepath false
      # `resources` holds the processed-image cache and carries almost all of
      # the saving; `hugo_cache` is only the WASM compile cache. Hugo does NOT
      # invalidate a processed image when `[imaging]` or its own version
      # changes, so both are baked into the key — otherwise a quality tweak
      # would keep serving images encoded under the old settings forever.
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('hugo.toml') }}-${{ github.run_id }}
          restore-keys:
            hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('hugo.toml') }}-
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
